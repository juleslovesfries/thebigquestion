<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go Out With Me?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root { --red:#e53935; --yellow:#ffd43b; --cream:#fff3c4; --ink:#24160f; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; overflow:hidden; background:#f6d58a;
    color:var(--ink); font-family:"Press Start 2P", monospace;
    image-rendering:pixelated;
  }
  body:before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
    background:repeating-linear-gradient(0deg, transparent 0 3px, #8d542b 3px 4px);
    mix-blend-mode:multiply; z-index:20;
  }
  .page { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card {
    width:min(720px,94vw); padding:46px 30px; text-align:center;
    background:var(--cream); border:7px solid var(--ink);
    box-shadow:12px 12px 0 var(--red), 18px 18px 0 var(--ink);
    position:relative;
  }
  h1 { font-size:clamp(24px,5vw,42px); line-height:1.45; margin:0 0 34px; }
  .subtitle { font-size:12px; line-height:1.8; margin-bottom:30px; }
  .buttons { display:flex; justify-content:center; gap:24px; min-height:90px; position:relative; }
  button {
    font:inherit; font-size:15px; cursor:pointer; border:5px solid var(--ink);
    padding:18px 25px; background:var(--yellow); color:var(--ink);
    box-shadow:6px 6px 0 var(--ink); transition:transform .08s;
  }
  button:hover { transform:translate(-2px,-2px); }
  #yes { background:#ff5757; color:white; }
  #no { position:relative; }
  .hidden { display:none !important; }
  #success { position:fixed; inset:0; background:#f6d58a; z-index:30; overflow:hidden; }
  .success-card { z-index:3; position:relative; }
  .success-card h1 { color:var(--red); text-shadow:4px 4px 0 var(--yellow); }
  .tiny { font-size:9px; line-height:1.8; margin-top:25px; }
  #confetti { position:absolute; inset:0; width:100%; height:100%; }
  #egg {
    position:absolute; right:18px; bottom:14px; width:26px; height:34px;
    border:3px solid var(--ink); border-radius:50% 50% 48% 48%;
    background:repeating-linear-gradient(0deg,#ffd43b 0 7px,#e53935 7px 14px);
    cursor:pointer; z-index:8; opacity:.8;
  }
  #egg:after { content:""; position:absolute; width:5px;height:5px;background:var(--ink);right:4px;top:5px;box-shadow:-9px 12px 0 var(--ink);opacity:.2; }
  #game { position:fixed; inset:0; background:#15100c; z-index:50; color:#ffd43b; display:grid; place-items:center; }
  .gamebox { width:min(720px,94vw); text-align:center; }
  #gameCanvas { width:min(600px,90vw); height:min(600px,65vh); background:#201810; border:6px solid #ffd43b; box-shadow:10px 10px 0 #e53935; image-rendering:pixelated; }
  .gamebox h2 { font-size:18px; line-height:1.5; }
  .gamebox p { font-size:9px; line-height:1.8; }
  #closeGame { background:#ffd43b; color:#24160f; font-size:10px; padding:12px 15px; margin-top:12px; }
  #status { min-height:20px; font-size:9px; }
  @media(max-width:600px){ .card{padding:34px 18px}.buttons{gap:12px} button{font-size:11px;padding:14px 16px}.success-card h1{font-size:23px}.subtitle{font-size:9px} }
</style>
</head>
<body>
<main id="question" class="page">
  <section class="card">
    <div class="subtitle">★ IMPORTANT QUESTION ★</div>
    <h1>Will you go out with me?</h1>
    <div class="buttons">
      <button id="yes">YES ♥</button>
      <button id="no">NO</button>
    </div>
    <div class="tiny">Choose wisely. There are consequences.</div>
  </section>
</main>

<section id="success" class="page hidden">
  <canvas id="confetti"></canvas>
  <section class="card success-card">
    <div class="subtitle">★ CONGRATULATIONS ★</div>
    <h1>thank god I didnt do all that for nothing</h1>
    <div class="tiny">♡ See you on our date ♡</div>
  </section>
  <div id="egg" title="..."></div>
</section>

<section id="game" class="hidden">
  <div class="gamebox">
    <h2>★ WORM TIME ★</h2>
    <p>Arrow keys / WASD · Eat the worms · Don't hit yourself</p>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="status">Score: 0</div>
    <button id="closeGame">BACK TO THE DATE</button>
  </div>
</section>

<script>
/* Moving NO button */
const no = document.getElementById('no');
const yes = document.getElementById('yes');
const question = document.getElementById('question');
const success = document.getElementById('success');
const egg = document.getElementById('egg');

function dodge() {
  const card = document.querySelector('.card');
  const area = document.querySelector('.buttons');
  const ar = area.getBoundingClientRect(), cr = card.getBoundingClientRect();
  const maxX = Math.max(20, cr.width - 130);
  const maxY = 80;
  const x = Math.random()*maxX - maxX/2;
  const y = Math.random()*maxY - maxY/2;
  no.style.position='absolute';
  no.style.left='50%';
  no.style.top='50%';
  no.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
}
['mouseenter','touchstart','pointerdown'].forEach(e=>no.addEventListener(e, dodge));
no.addEventListener('click', dodge);

/* Retro celebratory music made with Web Audio — no external music file required. */
let audioCtx;
function celebrateMusic(){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const now=audioCtx.currentTime;
  const notes=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5];
  notes.forEach((f,i)=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,now+i*.13);
    g.gain.exponentialRampToValueAtTime(.12,now+i*.13+.02);
    g.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.12);
    o.connect(g).connect(audioCtx.destination); o.start(now+i*.13); o.stop(now+i*.13+.14);
  });
}

/* Confetti */
const conf=document.getElementById('confetti'), ctx=conf.getContext('2d');
let pieces=[];
function resize(){ conf.width=innerWidth; conf.height=innerHeight; }
addEventListener('resize',resize); resize();
function launch(){
  pieces=Array.from({length:180},()=>({
    x:Math.random()*innerWidth,y:-Math.random()*innerHeight,
    s:5+Math.random()*10,vy:3+Math.random()*5,vx:(Math.random()-.5)*3,
    r:Math.random()*6,vr:(Math.random()-.5)*.2,
    c:Math.random()<.5?'#e53935':'#ffd43b'
  }));
  requestAnimationFrame(draw);
}
function draw(){
  ctx.clearRect(0,0,conf.width,conf.height);
  let alive=false;
  pieces.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.025;
    if(p.y<innerHeight+30) alive=true;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.5);ctx.restore();
  });
  if(alive) requestAnimationFrame(draw);
}

/* YES */
async function notifyYes(){
  try {
    await fetch('https://formsubmit.co/ajax/lilydauphinee@gmail.com', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        subject: '💕 THEY SAID YES!',
        message: 'Someone just clicked YES on your date website! 🎉',
        answer: 'YES',
        timestamp: new Date().toString()
      })
    });
  } catch (err) {
    // The celebration still works even if the notification service is unavailable.
    console.warn('Notification could not be sent:', err);
  }
}

yes.addEventListener('click',()=>{
  question.classList.add('hidden');
  success.classList.remove('hidden');
  celebrateMusic(); launch();
  notifyYes();
});

/* Easter egg -> Snake-like game */
egg.addEventListener('click',()=>{ success.classList.add('hidden'); document.getElementById('game').classList.remove('hidden'); startGame(); });
document.getElementById('closeGame').addEventListener('click',()=>{document.getElementById('game').classList.add('hidden');success.classList.remove('hidden');});

/* Game: pixel-art caricature of a generic Donald Trump-like character eating worms.
   It is intentionally stylized rather than a photorealistic depiction. */
const gc=document.getElementById('gameCanvas'), g=gc.getContext('2d'), status=document.getElementById('status');
let snake,dir,worm,score,timer,playing=false;
const cells=30, size=20;
function randCell(){ return {x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}; }
function startGame(){
  clearInterval(timer); snake=[{x:15,y:15},{x:14,y:15},{x:13,y:15}];dir={x:1,y:0};worm=randCell();score=0;playing=true;
  timer=setInterval(step,110); drawGame();
}
function drawFace(x,y){
  const px=x*size,py=y*size;
  g.fillStyle='#f1c7a1';g.fillRect(px+4,py+4,12,12);
  g.fillStyle='#f0a33b';g.fillRect(px+3,py+2,14,5);g.fillRect(px+6,py,10,4);
  g.fillStyle='#24160f';g.fillRect(px+7,py+8,2,2);g.fillRect(px+12,py+8,2,2);g.fillRect(px+9,py+13,5,2);
  g.fillStyle='#314c9b';g.fillRect(px+3,py+16,14,4);g.fillStyle='#fff';g.fillRect(px+7,py+16,6,2);
}
function drawGame(){
  g.fillStyle='#201810';g.fillRect(0,0,600,600);
  for(let i=0;i<snake.length;i++){ drawFace(snake[i].x,snake[i].y); }
  const wx=worm.x*size,wy=worm.y*size;
  g.strokeStyle='#ff5757';g.lineWidth=5;g.beginPath();g.moveTo(wx+5,wy+10);g.quadraticCurveTo(wx+10,wy-2,wx+16,wy+10);g.stroke();
  g.fillStyle='#ffd43b';g.fillRect(wx+4,wy+7,3,3);g.fillRect(wx+13,wy+7,3,3);
  status.textContent='Score: '+score;
}
function step(){
  if(!playing)return;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y)){
    playing=false;clearInterval(timer);status.textContent='GAME OVER — Score: '+score+' · Press Enter to restart';return;
  }
  snake.unshift(head);
  if(head.x===worm.x&&head.y===worm.y){score++;worm=randCell();}else snake.pop();
  drawGame();
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='enter'&&!playing&& !document.getElementById('game').classList.contains('hidden')){startGame();return;}
  const map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(map[k]){const [x,y]=map[k];if(x!==-dir.x||y!==-dir.y)dir={x,y};e.preventDefault();}
});
</script>
</body>
</html>
